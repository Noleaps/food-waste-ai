<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroWaste Merchandiser — Markdown & Intelligent Pricing Console</title>
  
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDN untuk rendering komponen interaktif -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Google Fonts: Inter & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@400;550;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

      font-family: 'Space Grotesk', sans-serif;

</head>
<body class="bg-[#f4f6fa] text-slate-850 antialiased pb-20">

  <div id="root"></div>

  <!-- React Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialProducts = [
      {

        name: "Organic Fresh Strawberries 250g",

        category: "Produce",
        stock: 42,

      },
      {

        category: "Meat & Seafood",
        stock: 12,
        stockUnit: "packs",
        priceUsd: 16.50,
        priceIdr: 250000,
        marginPercent: 47,

      },
      {
        id: "3",

        category: "Dairy",
        stock: 28,
        stockUnit: "tubs",

      },
      {
        id: "4",
        name: "Butter Croissant Pack of 4",

      },
      {
        id: "5",
        name: "Organic Baby Spinach 150g Bag",
        sku: "PRD-SPIN-05",
        category: "Produce",
        stock: 25,
        stockUnit: "bags",
        priceUsd: 3.49,
        priceIdr: 50000,
        marginPercent: 60,
        expiryDaysLeft: -2,
        status: "EXPIRED",
        badges: [],
      },
      {
        id: "6",
        name: "Organic Whole Milk 2L",
        sku: "DY-WHOLE-06",
        category: "Dairy",
        stock: 35,
        stockUnit: "bottles",
        priceUsd: 4.80,
        priceIdr: 72000,
        marginPercent: 52,
        expiryDaysLeft: -3,
        status: "EXPIRED",
        badges: [],
      },
      {
        id: "7",
        name: "In-Store Roasted Rotisserie Chicken",
        sku: "DL-ROAST-07",
        category: "Deli",
        stock: 12,
        stockUnit: "items",
        priceUsd: 9.99,
        priceIdr: 150000,
        marginPercent: 55,
        expiryDaysLeft: -1,
        status: "EXPIRED",
        badges: [],
      },
      {
        id: "8",
        name: "Classic Marinara Pasta Sauce Glass Jar",
        sku: "PN-PTAS-08",
        category: "Pantry",
        stock: 80,
        stockUnit: "jars",
        priceUsd: 3.20,
        priceIdr: 48000,
        marginPercent: 53,
        expiryDaysLeft: 179,
        status: "SAFE",
        badges: [],
      },
    ];

    function App() {
      const [products, setProducts] = useState(initialProducts);
      const [savingsUsd, setSavingsUsd] = useState(16.74);
      const [mealsDelivered, setMealsDelivered] = useState(9);
      const [deliRepurposed, setDeliRepurposed] = useState(0);
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedExpiryFilter, setSelectedExpiryFilter] = useState("All Items");
      const [selectedSectionFilter, setSelectedSectionFilter] = useState("All");
      const [systemClock, setSystemClock] = useState("12.00.00");
      const [toasts, setToasts] = useState([]);

      // Form Intake State
      const [isNewModalOpen, setIsNewModalOpen] = useState(false);
      const [newProduct, setNewProduct] = useState({
        name: "",
        sku: "",
        category: "Produce",
        stock: 20,
        stockUnit: "packs",
        priceUsd: 4.99,
        marginPercent: 55,
        expiryDaysLeft: 1,
      });

      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          const h = String(now.getHours()).padStart(2, '0');
          const m = String(now.getMinutes()).padStart(2, '0');
          const s = String(now.getSeconds()).padStart(2, '0');
          setSystemClock(`${h}.${m}.${s}`);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const triggerToast = (text, type = "success") => {
        const id = Date.now().toString();
        setToasts((prev) => [...prev, { id, text, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4000);
      };

      // FUNGSI UTAMA OPTIMIZED PRICE (PANGGIL API LANGSUNG DENGAN FALLBACK AMAN)
      const handleOptimizePrice = async (prodId) => {
        const product = products.find(p => p.id === prodId);
        if (!product) return;

        // Set Loading
        setProducts(prev => prev.map(p => p.id === prodId ? { ...p, isLoading: true } : p));
        triggerToast(`Mengontak API Optimasi untuk ${product.name}...`, "info");

        const payload = {
          nama: product.name,
          harga_idr: product.priceIdr || Math.floor(product.priceUsd * 15000),
          stok: product.stock,
          sisa_hari_expired: product.expiryDaysLeft
        };

        try {
          // Melakukan HTTP POST langsung
          const response = await fetch("https://food-waste-ai-625899891226.asia-southeast1.run.app/predict", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`Sektor respon API error dengan status ${response.status}`);
          }

          const data = await response.json();

          setProducts(prev => prev.map(p => {
            if (p.id === prodId) {
              return {
                ...p,
                isLoading: false,
                predictionResult: {
                  risiko: data.risiko || "Sedang",
                  prediksi_terjual: data.prediksi_terjual !== undefined ? data.prediksi_terjual : Math.floor(product.stock * 0.75),
                  diskon_rekomendasi: data.diskon_rekomendasi !== undefined ? data.diskon_rekomendasi : 15,
                  catatan: data.catatan || "Sukses mendapatkan kalkulasi diskon otomatis."
                }
              };
            }
            return p;
          }));

          triggerToast(`Saran diskon diterima: ${data.diskon_rekomendasi || 15}% untuk ${product.name}`, "success");

        } catch (error) {
          console.warn("Koneksi API diblokir CORS atau Server Offline, mengaktifkan Modul Intelijen Lokal Offline:", error);
          
          // Fallback algoritma lokal jika API diblokir CORS browser atau Server mati
          const mockDiscounts = product.expiryDaysLeft < 0 ? 75 : product.expiryDaysLeft === 0 ? 50 : product.expiryDaysLeft <= 2 ? 30 : 15;
          const mockRisiko = product.expiryDaysLeft < 0 ? "Sangat Tinggi" : product.expiryDaysLeft <= 2 ? "Tinggi" : "Sedang";

          setProducts(prev => prev.map(p => {
            if (p.id === prodId) {
              return {
                ...p,
                isLoading: false,
                predictionResult: {
                  risiko: mockRisiko,
                  prediksi_terjual: Math.floor(product.stock * 0.8) || 2,
                  diskon_rekomendasi: mockDiscounts,
                  catatan: `[Model Offline Bawaan] Karena limitasi CORS jaringan lokal browser, sistem menyarankan potongan harga aman sebesar ${mockDiscounts}% guna mengosongkan sisa rak.`
                }
              };
            }
            return p;
          }));

          triggerToast(`Optimasi Offline Berhasil diterapkan untuk ${product.name}!`, "info");
        }
      };

      const applyDiscountToCatalog = (prodId, discountPercent) => {
        setProducts(prev => prev.map(p => {
          if (p.id === prodId) {
            const originalUsd = p.priceUsd;
            const originalIdr = p.priceIdr;
            return {
              ...p,
              priceUsd: Number((originalUsd * (1 - discountPercent / 100)).toFixed(2)),
              priceIdr: Math.floor(originalIdr * (1 - discountPercent / 100)),
              marginPercent: Math.max(5, p.marginPercent - Math.floor(discountPercent * 0.3)),
              badges: [...(p.badges || []), "MARKED DOWN"],
              predictionResult: null
            };
          }
          return p;
        }));
        triggerToast("Diskon harga berhasil diaktifkan langsung pada sistem kasir POS!", "success");
      };

      const handleCheckout = (prodId, count) => {
        const product = products.find(p => p.id === prodId);
        if (!product || count <= 0 || product.stock < count) {
          triggerToast("Kuantitas tidak valid atau stok tidak berkecukupan.", "error");
          return;
        }

        const currentDiscount = product.predictionResult ? product.predictionResult.diskon_rekomendasi : 0;
        const finalPrice = product.priceUsd * ((100 - currentDiscount) / 100);
        const revenueGained = finalPrice * count;

        setProducts(prev => prev.map(p => {
          if (p.id === prodId) {
            return { ...p, stock: p.stock - count };
          }
          return p;
        }));

        setSavingsUsd(prev => Number((prev + revenueGained).toFixed(2)));
        triggerToast(`Sukses Checkout! Finansial terselamatkan sebesar: $${revenueGained.toFixed(2)}`, "success");
      };

      const handleAddStock = (e) => {
        e.preventDefault();
        if (!newProduct.name || !newProduct.sku) {
          triggerToast("Harap isi Nama dan Kode SKU barang.", "error");
          return;
        }

        const calculatedStatus = newProduct.expiryDaysLeft < 0 ? 'EXPIRED' : newProduct.expiryDaysLeft === 0 ? 'TODAY' : newProduct.expiryDaysLeft <= 2 ? 'CRITICAL' : 'SAFE';

        const added = {
          id: Date.now().toString(),
          name: newProduct.name,
          sku: newProduct.sku,
          category: newProduct.category,
          stock: Number(newProduct.stock),
          stockUnit: newProduct.stockUnit,
          priceUsd: Number(newProduct.priceUsd),
          priceIdr: Math.floor(newProduct.priceUsd * 15000),
          marginPercent: Number(newProduct.marginPercent),
          expiryDaysLeft: Number(newProduct.expiryDaysLeft),
          status: calculatedStatus,
          badges: newProduct.expiryDaysLeft <= 0 ? ["ACTIVE CLEARANCE"] : []
        };

        setProducts([added, ...products]);
        setIsNewModalOpen(false);
        triggerToast(`Produk "${newProduct.name}" berhasil masuk ke sistem rak!`, "success");
        setNewProduct({
          name: "",
          sku: "",
          category: "Produce",
          stock: 20,
          stockUnit: "packs",
          priceUsd: 4.99,
          marginPercent: 55,
          expiryDaysLeft: 1
        });
      };

      const searchedProducts = products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.sku.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesSection = selectedSectionFilter === "All" || p.category === selectedSectionFilter;
        let matchesExpiry = true;
        if (selectedExpiryFilter === "Active Stock") matchesExpiry = p.expiryDaysLeft >= 0 && p.stock > 0;
        else if (selectedExpiryFilter === "Expiring Soon (0-2d)") matchesExpiry = p.expiryDaysLeft >= 0 && p.expiryDaysLeft <= 2;
        else if (selectedExpiryFilter === "Marked Down") matchesExpiry = p.badges?.includes("MARKED DOWN") || !!p.predictionResult;
        else if (selectedExpiryFilter === "Expired") matchesExpiry = p.expiryDaysLeft < 0;

        return matchesSearch && matchesSection && matchesExpiry;
      });

      const priorityItems = products.filter(p => p.expiryDaysLeft <= 0);

      return (
        <div className="min-h-screen pb-20">
          
          {/* System Top Bar Banner */}
          <div className="bg-[#0b1f19] text-xs py-2 px-4 shadow-sm flex flex-wrap justify-between items-center text-white/90 gap-2 border-b border-emerald-950">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Terhubung ke Server Cerdas ZeroWaste &amp; Model Optimasi Deep Learning</span>
            </div>
            <div className="bg-emerald-950 text-emerald-400 font-bold px-2.5 py-0.5 rounded border border-emerald-900 text-[10px]">
              PREVIEW MODE: AKTIF
            </div>
          </div>

          {/* Header */}
          <header className="bg-white border-b border-slate-200/80 sticky top-0 z-40 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 bg-[#0c1425] rounded-xl flex items-center justify-center text-white text-xl">
                  🥬
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight text-[#0c1425]">
                    ZeroWaste <span className="text-[#00a878]">Merchandiser</span>
                  </h1>
                  <p className="text-xs font-mono text-slate-500 font-medium">Central Inventory &amp; Markdown Control</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 text-xs text-slate-600">
                <div className="bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-1.5">
                  <span className="text-[9px] text-slate-400 font-bold block uppercase tracking-wider">Market Operator</span>
                  <span className="font-semibold text-[#0c1425]">Chris Nathaniel (#L7-CHICAGO)</span>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-1.5 font-mono">
                  <span className="text-[9px] text-slate-400 font-bold block uppercase tracking-wider">System Clock</span>
                  <span className="font-bold text-[#0c1425]">{systemClock}</span>
                </div>

                <button 
                  onClick={() => setIsNewModalOpen(true)}
                  className="px-4 py-2.5 bg-[#00a878] hover:bg-[#009066] text-white font-bold rounded-xl shadow-md transition-transform active:scale-95 cursor-pointer"
                >
                  + Intake New Stock
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 pt-8 space-y-8">
            
            {/* CENTRAL ROW: PRIORITY BOARD & MTD STATS */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* PRIORITY TABLE */}
              <div className="lg:col-span-7 bg-white rounded-3xl border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center mb-5">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">⚠️</span>
                      <h2 className="text-base font-bold text-[#0c1425]">Priority Markdown Board</h2>
                    </div>
                    <span className="text-[10px] font-black uppercase text-rose-500 bg-rose-50 px-2 py-1 rounded border border-rose-100">ACTION REQUIRED</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-100 text-slate-400 font-bold pb-2">
                          <th className="pb-2">Item</th>
                          <th className="pb-2">SKU</th>
                          <th className="pb-2">Status</th>
                          <th className="pb-2">Stok</th>
                          <th className="pb-2 text-right">Aksi Pintar</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-50">
                        {priorityItems.map(item => (
                          <tr key={item.id} className="hover:bg-slate-50/50">
                            <td className="py-3 font-bold text-[#0c1425]">{item.name}</td>
                            <td className="py-3 font-mono text-[10px] text-slate-400">{item.sku}</td>
                            <td className="py-3">
                              <span className="bg-rose-50 text-rose-600 font-bold px-2 py-0.5 rounded text-[10px]">EXPIRED</span>
                            </td>
                            <td className="py-3 text-slate-600 font-semibold">{item.stock} {item.stockUnit}</td>
                            <td className="py-3 text-right">
                              {item.predictionResult ? (
                                <button
                                  onClick={() => applyDiscountToCatalog(item.id, item.predictionResult.diskon_rekomendasi)}
                                  className="bg-[#0c1425] hover:bg-[#00a878] text-white text-[10px] font-bold py-1 px-2.5 rounded transition-colors"
                                >
                                  Terapkan Diskon {item.predictionResult.diskon_rekomendasi}%
                                </button>
                              ) : (
                                <button
                                  onClick={() => handleOptimizePrice(item.id)}
                                  disabled={item.isLoading}
                                  className="bg-[#dbf9ed] text-[#00a878] hover:bg-[#00a878] hover:text-white font-bold py-1 px-3 rounded-full text-[10px] transition-colors"
                                >
                                  {item.isLoading ? "Menganalisis..." : "✨ Gemini Suggest"}
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="border-t border-slate-100 pt-3 mt-4 text-[10px] text-slate-400 font-medium">
                  Prioritas rak sinkron dari penyimpanan pusat inventaris.
                </div>
              </div>

              {/* MTD SAVINGS CARD */}
              <div className="lg:col-span-5 bg-[#0c1425] text-white rounded-3xl p-6 flex flex-col justify-between shadow-lg relative">
                <div>
                  <div className="flex justify-between items-start">
                    <div>
                      <h3 className="text-sm font-bold text-white/95">Savings Overview (MTD)</h3>
                      <p className="text-[10px] text-emerald-400 font-mono tracking-widest uppercase mt-0.5">Dynamic Revenue Salvaged</p>
                    </div>
                    <span className="text-xl">✅</span>
                  </div>

                  <div className="mt-8">
                    <span className="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Estimated Salvaged Value</span>
                    <div className="flex items-baseline gap-3 mt-1">
                      <span className="text-4xl font-extrabold text-white">${savingsUsd.toFixed(2)}</span>
                      <span className="bg-[#dbf9ed]/10 text-emerald-400 font-bold text-[11px] px-2.5 py-0.5 rounded-full border border-emerald-400/20">+14.2% MTD</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mt-6">
                    <div className="bg-[#15233c] p-4 rounded-2xl border border-slate-700/30">
                      <span className="text-[10px] text-slate-400 block font-bold uppercase">Meals Delivered</span>
                      <span className="text-2xl font-black block mt-1">{mealsDelivered}</span>
                      <span className="text-[10px] text-emerald-400 block mt-1">Disumbangkan</span>
                    </div>

                    <div className="bg-[#15233c] p-4 rounded-2xl border border-slate-700/30">
                      <span className="text-[10px] text-slate-400 block font-bold uppercase">Deli Repurposed</span>
                      <span className="text-2xl font-black block mt-1">{deliRepurposed} <span className="text-xs text-slate-400 font-normal">units</span></span>
                      <span className="text-[10px] text-blue-300 block mt-1">Dapur Saji Kembali</span>
                    </div>
                  </div>
                </div>

                <div className="border-t border-slate-800/80 pt-4 mt-6 flex justify-between text-[11px] text-slate-400">
                  <span>Carbon offset active</span>
                  <span className="text-emerald-400 font-bold animate-pulse">• LIVE ACCURATE</span>
                </div>
              </div>

            </div>

            {/* METRICS DASHBOARD ROW */}
            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
              
              {/* LOSS RISK */}
              <div className="md:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 flex flex-col justify-between">
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400 block mb-4">Loss Risk By Dept</span>
                  <div className="space-y-3">
                    {[
                      { name: "Produce", value: 50, color: "bg-red-500" },
                      { name: "Meat & Seafood", value: 100, color: "bg-rose-600" },
                      { name: "Dairy", value: 50, color: "bg-orange-500" },
                      { name: "Bakery", value: 5, color: "bg-amber-400" }
                    ].map((dept, i) => (
                      <div key={i} className="space-y-1">
                        <div className="flex justify-between text-xs text-[#0c1425] font-bold">
                          <span>{dept.name}</span>
                          <span>{dept.value}%</span>
                        </div>
                        <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div className={`h-full ${dept.color}`} style={{ width: `${dept.value}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="border-t border-slate-100 pt-3 mt-4 text-[10px] text-slate-400">Analisis berdasarkan hari tersisa kadaluarsa.</div>
              </div>

              {/* CENTER COMPONENT */}
              <div className="md:col-span-4 bg-[#00a878] text-white p-5 rounded-3xl flex flex-col justify-between">
                <div>
                  <span className="text-2xl block mb-3">⚡</span>
                  <h3 className="font-extrabold text-base">Gemini Pricing Optimization</h3>
                  <p className="text-xs text-white/85 mt-2 leading-relaxed">
                    Sistem memprediksi tingkat kelulusan clearance rak mencapai <strong className="underline font-bold decoration-emerald-200">94% dalam waktu 24 jam</strong> jika parameter rekomendasi diskon dipenuhi.
                  </p>
                </div>
                <button className="bg-[#0c1425] text-white font-bold text-xs py-2.5 w-full rounded-xl transition-colors mt-6 hover:bg-[#15233c]">
                  Consult Matrix →
                </button>
              </div>

              {/* PERFORMANCE GRID */}
              <div className="md:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 flex flex-col justify-between">
                <div className="grid grid-cols-3 gap-2 border-b border-slate-100 pb-4">
                  <div>
                    <span className="text-[9px] text-slate-400 block font-bold">STOCK TURN</span>
                    <span className="text-xl font-extrabold text-[#0c1425] mt-1 block">1.1x</span>
                    <span className="text-[9px] text-emerald-500 font-bold block mt-1">Ideal</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 block font-bold">MITIGASI</span>
                    <span className="text-xl font-extrabold text-rose-500 mt-1 block">-3%</span>
                    <span className="text-[9px] text-emerald-500 font-bold block mt-1">Menurun</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 block font-bold">AKURASI</span>
                    <span className="text-xl font-extrabold text-[#0c1425] mt-1 block">98.4%</span>
                    <span className="text-[9px] text-emerald-500 font-bold block mt-1">RFID Sesuai</span>
                  </div>
                </div>

                <div className="pt-4 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-[#0c1425] block">3 Operator Aktif</span>
                    <span className="text-[10px] text-slate-400">Mode Kolaborasi Aktif</span>
                  </div>
                  <span className="text-[9px] text-slate-400 bg-slate-100 py-1 px-2.5 rounded-full font-bold uppercase">COLLAB MODE</span>
                </div>
              </div>

            </div>

            {/* TAB LEVEL FILTERS */}
            <div className="flex border-b border-slate-200 gap-6 mt-8">
              <button className="pb-3 text-sm font-bold border-b-2 border-[#00a878] text-[#0c1425]">
                Shelf Expiration Manager
              </button>
            </div>

            {/* EXPIRATION MANAGER GRID & SEARCH PANEL */}
            <div className="space-y-6">
              
              {/* FILTER CARD COMPLEX */}
              <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-4 shadow-xs">
                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                  
                  <div className="md:col-span-4 relative">
                    <input 
                      type="text"
                      placeholder="Cari kata kunci barang atau SKU..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                    />
                  </div>

                  <div className="md:col-span-8 flex flex-wrap gap-2 md:justify-end text-[11px] font-bold">
                    {["All Items", "Active Stock", "Expiring Soon (0-2d)", "Marked Down", "Expired"].map(t => (
                      <button
                        key={t}
                        onClick={() => setSelectedExpiryFilter(t)}
                        className={`py-1.5 px-3 rounded-lg ${selectedExpiryFilter === t ? "bg-[#0c1425] text-white" : "bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200"}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>

                </div>

                <div className="border-t border-slate-100 pt-3 flex flex-wrap items-center gap-2">
                  <span className="text-[10px] text-slate-400 font-extrabold uppercase mr-2">Sektor:</span>
                  {["All", "Produce", "Meat & Seafood", "Dairy", "Bakery", "Pantry", "Deli"].map(s => (
                    <button
                      key={s}
                      onClick={() => setSelectedSectionFilter(s)}
                      className={`text-[11px] font-bold py-1 px-3 rounded-lg ${selectedSectionFilter === s ? "bg-[#00a878]/10 text-[#00a878] border border-[#00a878]/20" : "text-slate-500 hover:bg-slate-50"}`}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>

              {/* SHELF CARDS LIST */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {searchedProducts.map(p => {
                  const isExpired = p.expiryDaysLeft < 0;
                  let badgeColor = "bg-green-50 text-emerald-600 border border-emerald-100";
                  let expiryLabel = `🟢 SAFE (${p.expiryDaysLeft}h left)`;

                  if (p.expiryDaysLeft === 0) {
                    badgeColor = "bg-amber-50 text-amber-600 border border-amber-100";
                    expiryLabel = "⚡ HARI INI";
                  } else if (p.expiryDaysLeft > 0 && p.expiryDaysLeft <= 2) {
                    badgeColor = "bg-orange-50 text-orange-600 border border-orange-100";
                    expiryLabel = `⚠️ CRITICAL (${p.expiryDaysLeft}h lagi)`;
                  } else if (isExpired) {
                    badgeColor = "bg-rose-50 text-rose-600 border border-rose-100";
                    expiryLabel = `🔴 EXPIRED (${Math.abs(p.expiryDaysLeft)}h lalu)`;
                  }

                  const progressPercentage = Math.min(100, Math.max(8, (p.stock / 100) * 100));

                  return (
                    <div key={p.id} className="bg-white rounded-3xl border border-slate-200 p-5 flex flex-col justify-between hover:shadow-lg transition-transform duration-200">
                      
                      <div>
                        {/* Header card badge */}
                        <div className="flex justify-between items-start mb-3">
                          <span className="text-[9px] font-black uppercase text-amber-500 bg-amber-500/10 px-1.5 py-0.5 rounded">
                            {p.badges?.length > 0 ? p.badges[0] : "ACTIVE EXPIRY"}
                          </span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${badgeColor}`}>{expiryLabel}</span>
                        </div>

                        <span className="text-[9px] font-mono text-slate-400 block mt-1">{p.sku} | {p.category.toUpperCase()}</span>
                        <h4 className="text-[#0c1425] font-extrabold text-sm tracking-tight mt-1 leading-snug">{p.name}</h4>

                        {/* Inventory progress box */}
                        <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 mt-4">
                          <div className="flex justify-between text-[10px] font-bold text-[#0c1425] mb-1">
                            <span>Inventory Level:</span>
                            <span>{p.stock} {p.stockUnit}</span>
                          </div>
                          <div className="w-full h-3 bg-slate-200 rounded overflow-hidden">
                            <div className="bg-[#0c1425]/90 h-full rounded" style={{ width: `${progressPercentage}%` }}></div>
                          </div>
                        </div>

                        {/* Price table */}
                        <div className="grid grid-cols-2 gap-2 border-t border-slate-100 pt-3 mt-4">
                          <div>
                            <span className="text-[9px] text-slate-400 font-bold block uppercase">Retail Unit Price</span>
                            <span className="text-xs font-black text-[#0c1425]">${p.priceUsd.toFixed(2)}</span>
                            <span className="text-[9px] text-slate-400 block">Rp {p.priceIdr.toLocaleString("id-ID")}</span>
                          </div>
                          <div>
                            <span className="text-[9px] text-slate-400 font-bold block uppercase text-right">Projected Margin</span>
                            <span className="text-xs font-black text-[#00a878] block text-right">{p.marginPercent}%</span>
                          </div>
                        </div>

                      </div>

                      {/* API RESPONSE SECTION WRAPPED IN PRODUCT CARD */}
                      <div className="mt-4 pt-3 border-t border-slate-100">
                        {p.predictionResult ? (
                          <div className="bg-[#f0fdf4] p-3 rounded-2xl border border-emerald-200 text-xs mb-3 space-y-2">
                            <div className="flex justify-between items-center text-[10px] font-bold uppercase text-emerald-800">
                              <span>Hasil Ai Predict:</span>
                              <span className="bg-emerald-200 text-emerald-900 px-1.5 py-0.5 rounded">Risk: {p.predictionResult.risiko}</span>
                            </div>
                            <div className="text-[11px] font-semibold text-slate-700">
                              Rekomendasi Diskon: <span className="text-emerald-700 font-black">{p.predictionResult.diskon_rekomendasi}%</span>
                            </div>
                            <div className="text-[10px] text-slate-500 leading-normal bg-white p-2 rounded border border-emerald-100">
                              {p.predictionResult.catatan}
                            </div>
                            <button
                              onClick={() => applyDiscountToCatalog(p.id, p.predictionResult.diskon_rekomendasi)}
                              className="w-full py-1.5 bg-[#00a878] hover:bg-[#009066] text-white text-[10px] font-bold rounded-lg transition-colors"
                            >
                              Terapkan Diskon Ke Mesin POS
                            </button>
                          </div>
                        ) : null}

                        {/* Action buttons inside card */}
                        <div className="flex gap-2">
                          {!isExpired ? (
                            <button
                              onClick={() => handleCheckout(p.id, 1)}
                              disabled={p.stock <= 0}
                              className="flex-1 py-2 bg-[#0c1425] hover:bg-slate-800 text-white font-bold text-xs rounded-xl cursor-pointer disabled:opacity-50"
                            >
                              Sell Checkout
                            </button>
                          ) : (
                            <button
                              onClick={() => {
                                setProducts(prev => prev.map(item => item.id === p.id ? { ...item, stock: 0 } : item));
                                setMealsDelivered(prev => prev + p.stock);
                                triggerToast(`Donasi Sayuran Segar ${p.name} sebanyak ${p.stock} disalurkan!`, "success");
                              }}
                              disabled={p.stock <= 0}
                              className="flex-1 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 font-bold text-[10px] rounded-xl cursor-pointer disabled:opacity-50"
                            >
                              💝 Donasi Foodbank
                            </button>
                          )}

                          <button
                            onClick={() => handleOptimizePrice(p.id)}
                            disabled={p.isLoading}
                            className="bg-[#00a878] hover:bg-[#009066] text-white font-bold text-xs py-2 px-3 rounded-xl cursor-pointer flex items-center justify-center min-w-[100px] transition-colors"
                          >
                            {p.isLoading ? "Berpikir..." : "Optimized Price"}
                          </button>
                        </div>
                      </div>

                    </div>
                  );
                })}
              </div>

            </div>

          </main>

          {/* ADD STOCK MODAL POPUP */}
          {isNewModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border border-slate-200 text-slate-800">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <h3 className="font-bold text-[#0c1425] text-base">Intake New Stock Catalog Entry</h3>
                  <button onClick={() => setIsNewModalOpen(false)} className="text-slate-400 hover:text-slate-650 text-sm font-bold">✕</button>
                </div>

                <form onSubmit={handleAddStock} className="space-y-4 mt-4">
                  <div>
                    <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Nama Barang</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Organic Whole Milk" 
                      value={newProduct.name}
                      onChange={(e) => setNewProduct({ ...newProduct, name: e.target.value })}
                      className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Kode SKU</label>
                      <input 
                        type="text" 
                        required
                        placeholder="e.g. DY-WHOLE-09" 
                        value={newProduct.sku}
                        onChange={(e) => setNewProduct({ ...newProduct, sku: e.target.value })}
                        className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Kategori</label>
                      <select 
                        value={newProduct.category}
                        onChange={(e) => setNewProduct({ ...newProduct, category: e.target.value })}
                        className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                      >
                        {["Produce", "Meat & Seafood", "Dairy", "Bakery", "Pantry", "Deli"].map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Stok Awal</label>
                      <input 
                        type="number" 
                        required
                        value={newProduct.stock}
                        onChange={(e) => setNewProduct({ ...newProduct, stock: Number(e.target.value) })}
                        className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Satuan Stok</label>
                      <input 
                        type="text" 
                        value={newProduct.stockUnit}
                        onChange={(e) => setNewProduct({ ...newProduct, stockUnit: e.target.value })}
                        className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Harga Retail (USD)</label>
                      <input 
                        type="number" 
                        step="0.01"
                        required
                        value={newProduct.priceUsd}
                        onChange={(e) => setNewProduct({ ...newProduct, priceUsd: Number(e.target.value) })}
                        className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] uppercase font-extrabold text-slate-400 block mb-1">Sisa Hari Menuju Expiration</label>
                    <input 
                      type="number" 
                      required
                      value={newProduct.expiryDaysLeft}
                      onChange={(e) => setNewProduct({ ...newProduct, expiryDaysLeft: Number(e.target.value) })}
                      className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none"
                    />
                  </div>

                  <div className="pt-4 flex justify-end gap-2 border-t border-slate-100">
                    <button type="button" onClick={() => setIsNewModalOpen(false)} className="text-xs font-bold text-slate-500 py-2 px-4 cursor-pointer">Batal</button>
                    <button type="submit" className="bg-[#00a878] hover:bg-[#009066] text-white text-xs font-bold py-2 px-5 rounded-xl cursor-pointer">Simpan Stock</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST SYSTEM */}
          <div className="fixed bottom-5 right-5 space-y-2 z-50 max-w-sm">
            {toasts.map(t => (
              <div 
                key={t.id} 
                className={`p-3 rounded-xl shadow-lg text-xs font-semibold text-white border flex items-center justify-between gap-3 ${
                  t.type === "error" 
                    ? "bg-rose-600 border-rose-500" 
                    : t.type === "info" 
                      ? "bg-[#0c1425] border-slate-800" 
                      : "bg-[#00a878] border-emerald-500"
                }`}
              >
                <span>{t.text}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
